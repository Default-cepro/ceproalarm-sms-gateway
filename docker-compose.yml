services:
  sms-gateway:
    build: .
    container_name: ceproalarm-sms-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    env_file:
      - .env
    environment:
      SMS_GATE_SERVER_HOST: 0.0.0.0
      SMS_GATE_SERVER_PORT: 8000
      SMS_GATE_LOG_PATH: /app/logs/app.log
      SMS_GATE_LOCAL_API_ENABLED: "1"
      SMS_GATE_LOCAL_API_BASE_URL: http://127.0.0.1:18080
      SMS_GATE_LOCAL_API_COUNTRY_CODE: ${SMS_GATE_LOCAL_API_COUNTRY_CODE:-58}
      TZ: ${SMS_GATE_TIMEZONE:-America/Caracas}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
